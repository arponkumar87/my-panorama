```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My 360° Panorama</title>

    <!-- Pannellum CSS -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"
    >

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #panorama {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>

<body>

    <div id="panorama"></div>

    <!-- Pannellum JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js">
    </script>

    <script>
        pannellum.viewer('panorama', {
            "type": "equirectangular",

            "panorama": "panorama.jpg",

            "autoLoad": true,

            "autoRotate": -2,

            "showControls": true,

            "compass": true,

            "title": "My 360° Panorama",

            "author": "My Website",

            "hfov": 100,

            "minHfov": 50,

            "maxHfov": 120
        });
    </script>

</body>
</html>
